[workspace]
members = [
    "crates/joytoggle-core",
    "crates/joytoggle-daemon",
    "crates/joytoggle-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mikodzi <mirek@utumno.cc>"]
license = "GPL-3.0-only"
repository = "https://github.com/Mirkko/joytoggle"

[workspace.dependencies]
# shared across crates — pin versions here
joytoggle-core = { path = "crates/joytoggle-core" }
serde           = { version = "1",    features = ["derive"] }
serde_json      = "1"
anyhow          = "1"
thiserror       = "2"
tokio           = { version = "1", features = ["full"] }
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
