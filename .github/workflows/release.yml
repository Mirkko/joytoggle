name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcb1-dev pkg-config

      - name: Build release
        run: cargo build --release --workspace

      - name: Install packaging tools
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Build .deb packages
        run: |
          cargo deb -p joytoggle-daemon --no-build
          cargo deb -p joytoggle-app --no-build

      - name: Build .rpm packages
        run: |
          cargo generate-rpm -p crates/joytoggle-daemon
          cargo generate-rpm -p crates/joytoggle-app

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/release/joytoggle target/release/joytoggle-daemon dist/
          cp target/debian/*.deb dist/ 2>/dev/null || true
          cp target/generate-rpm/*.rpm dist/ 2>/dev/null || true
          # Rename to include OS label
          for f in dist/*.deb dist/*.rpm dist/joytoggle dist/joytoggle-daemon; do
            [ -f "$f" ] && mv "$f" "${f%.*}-${{ matrix.os }}.${f##*.}" 2>/dev/null || true
          done
          ls dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: dist/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
