[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
version = 2
ignore  = []
unmaintained = "warn"

[licenses]
version       = 2
allow         = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "GPL-3.0", "LGPL-2.1", "MPL-2.0", "CC0-1.0", "Zlib"]
exceptions    = []

[bans]
multiple-versions = "warn"
wildcards         = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git      = "warn"
