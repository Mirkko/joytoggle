[package]
name        = "joytoggle-daemon"
description = "D-Bus system service — replaces pkexec, runs as root via systemd"
publish     = false
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[[bin]]
name = "joytoggle-daemon"
path = "src/main.rs"

[dependencies]
joytoggle-core     = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
zbus               = { version = "5", features = ["tokio"] }
nix                = { version = "0.29", features = ["user"] }

[package.metadata.deb]
name            = "joytoggle-daemon"
maintainer      = "Mikodzi <mirek@utumno.cc>"
copyright       = "2025 Mikodzi"
license-file    = ["../../LICENSE", "0"]
extended-description = "JoyToggle D-Bus system daemon. Manages joystick device bind/unbind at the kernel level via systemd. Required for the joytoggle GUI to function."
depends         = "$auto, polkit, policykit-1, systemd"
section         = "utils"
priority        = "optional"
maintainer-scripts = "../../packaging/debian/"
systemd-units   = { enable = true }
assets = [
    ["target/release/joytoggle-daemon", "usr/bin/joytoggle-daemon", "755"],
    ["../../packaging/systemd/joytoggle-daemon.service", "lib/systemd/system/joytoggle-daemon.service", "644"],
    ["../../packaging/polkit/org.joytoggle.daemon.policy", "usr/share/polkit-1/actions/org.joytoggle.daemon.policy", "644"],
]

[package.metadata.generate-rpm]
name        = "joytoggle-daemon"
license     = "GPL-3.0-or-later"
summary     = "JoyToggle D-Bus system daemon"
description = "JoyToggle D-Bus system daemon. Manages joystick device bind/unbind at the kernel level via systemd. Required for the joytoggle GUI to function."
requires    = ["polkit", "systemd"]

[[package.metadata.generate-rpm.assets]]
source = "target/release/joytoggle-daemon"
dest   = "/usr/bin/joytoggle-daemon"
mode   = "755"

[[package.metadata.generate-rpm.assets]]
source = "packaging/systemd/joytoggle-daemon.service"
dest   = "/usr/lib/systemd/system/joytoggle-daemon.service"
mode   = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/polkit/org.joytoggle.daemon.policy"
dest   = "/usr/share/polkit-1/actions/org.joytoggle.daemon.policy"
mode   = "644"
